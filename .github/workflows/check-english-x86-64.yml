name: Check English Major C x86-64 source compiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-x86:
    name: Exact-head English x86 compiler and rejection cases
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact revision
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD"
          echo "verified_head=$HEAD"
      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ARM and x86 language compilers, then regenerate assembly
        shell: bash
        run: |
          set -euo pipefail
          node --test _/tests/compile-english-assembly.test.mjs _/tests/compile-english-x86-64.test.mjs
          node _/tools/compile-english-assembly.mjs \
            'arm/thumb/addition/An unknown entry is omitted from an addition.english' \
            "$RUNNER_TEMP/arm.s"
          cmp "$RUNNER_TEMP/arm.s" arm/thumb/addition/generated-thumb.s
          node _/tools/compile-english-x86-64.mjs \
            'x86/addition/An unknown entry is omitted using x86-64 instructions.english' \
            "$RUNNER_TEMP/x86.s"
          cmp "$RUNNER_TEMP/x86.s" x86/addition/generated-x86-64.s

# Source grammar/assembly reproducibility only; not native/emulated execution.
