name: Audit recorded x86 QR semantic defects independently
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preserve-independent-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact audit candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original crosswalk and rejection fixtures
        run: node _/captures/r-lm-native-x86-64/english-translation/verify-english-ledgers.mjs --self-test
      - name: Execute independent ELF decoding and native instruction witnesses
        run: node _/autogenerated/x86-qr-semantics/verify-audit.mjs
