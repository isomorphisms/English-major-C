name: DEX catalogue source inventory
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compare independent source tables and reject broken inventories
        shell: node {0}
        run: |
          const { spawnSync } = require('node:child_process');
          const result = spawnSync(process.execPath,
            ['examples/autogenerated/dex-inventory/verify.mjs'], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status === null ? 1 : result.status);
# This source audit is not ai-ci acceptance or semantic/runtime execution.
# The separate ai-ci suite is prepared under ci/; its absent local execution
# remains NOT_RUN in the audit rather than being relabeled by this workflow.
