name: Execute exact archived ARM QR softfp objects
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-softfp-execution:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refresh runner package metadata
        run: sudo apt-get update
      - name: Provision QEMU, ARM disassembler and the identified soft-float runtime
        run: sudo apt-get install -y --no-install-recommends qemu-user binutils-arm-linux-gnueabi libc6-armel-cross=2.39-0ubuntu8cross1
      - name: Check archive bytes, rerun numerical and per-instruction state evidence
        run: node _/autogenerated/arm-qr-softfp-execution/verify-softfp-execution.mjs
