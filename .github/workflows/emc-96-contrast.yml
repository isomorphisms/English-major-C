name: English interpretation contrast tests and independent Idric
on:
  pull_request:
permissions:
  contents: read
jobs:
  comparison-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Execute synthetic evaluator controls, not model inference
        run: node --test _/research/model-interpretation/*.test.mjs
  discrete-idric:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: .idric-host
          persist-credentials: false
      - name: Build and run the actual independent Idric source interpreter
        env:
          IDRIC_HOME: ${{ github.workspace }}/.idric-host
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node _/research/model-interpretation/qualify-discrete.mjs
# Standard public runners only. No paid endpoint, larger runner, upload-artifact,
# cache action, LFS, model weight mirror, schedule, or automatic merge is used.
# Compiler bootstrap host prerequisites follow canonical Idric's own entrypoint.
  model-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [smollm3, granite4, qwen3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run actual publisher weights on a standard public CPU runner
        run: node _/research/model-interpretation/ci-model-smoke.mjs '${{ matrix.model }}'
