name: One-off Fortran archived-corpus accounting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate and archived source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize separately pinned independent oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 16a0750defe8cdad6431f5605626109ae15feb90
          path: _ai_ci
          persist-credentials: false
      - name: Materialize pinned Intel CMOV reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: intel/SDM
          ref: 48741fad8f9cd646450c6f98ae945ff55acbd558
          path: _intel_sdm
          persist-credentials: false
      - name: Reproduce complete source-only tables
        run: node _/autogenerated/fortran-coverage/audit.mjs --check
      - name: Independently check original bytes and reject targeted corruptions
        run: node _ai_ci/fortran-coverage/check.mjs --repository "$GITHUB_WORKSPACE" --path-map _/path-map.tsv --self-test --receipt "$RUNNER_TEMP/fortran-acceptance.tsv"
      - name: Reproduce linked ARM English ledgers
        run: node _/autogenerated/arm-linked-ledgers/generate.mjs --check
      - name: Independently check linked ledgers and reject targeted corruptions
        run: node _ai_ci/fortran-coverage/check-arm-ledgers.mjs --repository "$GITHUB_WORKSPACE" --path-map _/path-map.tsv --self-test --receipt "$RUNNER_TEMP/arm-ledger-acceptance.tsv"
      - name: Independently check finite CMOV claims against pinned primary rules
        run: node _ai_ci/fortran-coverage/check-cmov-claims.mjs --repository "$GITHUB_WORKSPACE" --path-map _/path-map.tsv --primary-file "$GITHUB_WORKSPACE/_intel_sdm/data/sdm/CMOVcc.docbook" --self-test --receipt "$RUNNER_TEMP/cmov-claims.tsv"
      - name: Retain exact-head accounting and finite-claim receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fortran-structural-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fortran-acceptance.tsv
            ${{ runner.temp }}/arm-ledger-acceptance.tsv
            ${{ runner.temp }}/cmov-claims.tsv
            ${{ runner.temp }}/cmov-claims.tsv.cases.tsv
          if-no-files-found: error
